<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://app.unpkg.com/boxicons@2.1.4/files/dev.box-icon-element.html">
    <link rel="stylesheet" href="style.css">
    <title>PORTAL IFNMG</title>
</head>
<body>
    <main class="container">
        <form>
        <h1>PORTAL IFNMG</h1>
        <img src="ifnmg_vertical1_jpg-removebg-preview.png" alt="logo do IFNMG" class="logo">
        <div class="input-box">
        <input type="email" placeholder="Usuario">
        <i class="bx bxs-user"></i>
        </div>
        <div class="input-box">
        <input type="password" placeholder="Senha">
        <i class="bx bxs-lock-alt"></i>
        </div>
        <div class="lembrar-senha"></div>
        <label>
                <input type="checkbox">
                <span>Lembrar minha senha</span>
        
        </label>
        <a href="#">Esqueci minha senha</a>
        </div>

        <button type="submit" class="login">Entrar</button>
        <div class="Cadastro">
        <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
        </div>
        </form>
    </main>
</body>
</html>
